<style>
:root{--sea:#007272;--ocean:#00343e;--mint:#a5e1d2;--pale:#e9f6f2;--summer:#28b482;--red:#dc2a2a;--yellow:#fdbb31;--bg:#f2f6f5;--card:#fff;--txt:#17292c;--mut:#5e7275;--line:#dde6e4;--soft:#eef2f1;--tab:58px}

html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}

main{padding:12px 12px calc(var(--tab) + env(safe-area-inset-bottom) + 24px);max-width:640px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}

.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,40,40,.07)}
.card h2{margin:0 0 10px;font-size:17px;color:var(--ocean)}
p{margin:8px 0}
textarea,input[type=text],input[type=search],input[type=time],input[type=date]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--txt);-webkit-appearance:none;appearance:none}

.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.grow{flex:1}
label.time{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:14px}
label.time input{width:112px;padding:8px 10px}
button{font:inherit;border:0;border-radius:10px;cursor:pointer;color:inherit}
.primary{background:var(--sea);color:#fff;font-weight:700;padding:11px 20px}
.primary:disabled{opacity:.35}
.secondary{background:var(--pale);color:var(--sea);font-weight:600;padding:10px 14px}
.danger-btn{background:#fde8e8;color:var(--red);font-weight:600;padding:10px 14px}
.link{background:none;color:var(--sea);padding:6px 0;font-weight:600;text-decoration:none;display:inline-block;font-size:15px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type{background:var(--tb);border:2px solid transparent;padding:11px 6px;text-align:center}

.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin:6px 0 12px}

.lbl{font-size:14px;font-weight:600;color:var(--ocean);margin-top:4px}.lbl span{font-weight:400;color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--pale);color:var(--sea);font-weight:600;white-space:nowrap}
.tag.unk{background:#fff1c2;color:#7a4b00}.tag.fac{background:#e6eefc;color:#2a4d9b}.tag.red{background:#fde8e8;color:var(--red)}.tag.grey{background:var(--soft);color:var(--mut)}
.preview{font-size:13px;color:var(--mut);margin-top:6px}
.entry{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;border-radius:0}

.banner button{flex:none}

.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}

table.t th{color:var(--mut);font-weight:600}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.trig{border-top:1px solid var(--line);padding:10px 0}
.trig.first{border-top:0}
.trh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-tydelig{background:var(--red);color:#fff}.p-mulig{background:var(--yellow);color:#3d2a00}.p-ingen{background:#d3efe3;color:#145c3c}.p-lite{background:var(--soft);color:#8a9a9c}
.trd{font-size:14px;margin-top:4px}.trn{font-size:12px;color:var(--mut)}
.status{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}

.hdate{width:56px;flex:none;font-weight:700;color:var(--ocean);text-transform:capitalize}.hdate small{display:block;font-weight:500;color:var(--mut)}
.hinfo{font-size:14px}.hinfo .m{color:var(--mut);margin-top:2px}
.menu > *{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:13px 2px;border-top:1px solid var(--line);background:none;text-decoration:none;text-align:left;border-radius:0;font-size:16px;color:var(--txt)}
.menu > :first-child{border-top:0}
.menu .sub{font-size:13px;color:var(--mut);text-align:right}
.sheet-bg{position:fixed;inset:0;background:rgba(0,30,35,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 12px;color:var(--ocean)}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.cat{background:var(--soft);padding:9px 10px;text-align:left;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.cat.x{background:var(--sea);color:#fff}.cat.neg{background:#fde8e8;color:var(--red)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px;margin-top:6px}
.seg button{flex:1;padding:8px 4px;background:none;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--sea);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.wordrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;border-radius:0}
.wordrow b{font-weight:600}.wordrow .tags{margin:0;justify-content:flex-end}
.step{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.stp{display:flex;align-items:center;gap:8px;flex:none}
.stp button{width:40px;height:40px;background:var(--pale);color:var(--sea);font-size:20px;font-weight:700}
.stp span{min-width:26px;text-align:center;font-weight:700;font-size:18px}
.mut{color:var(--mut)}
ul.flags{margin:6px 0;padding-left:20px}ul.flags li{margin:4px 0}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 16px);transform:translate(-50%,16px);background:var(--ocean);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media print{nav.tabs,header.top,.noprint,.banner,.note{display:none!important}body,html{background:#fff}main{padding:0;max-width:none}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}}

</style>

<script>
/* Magedagbok – kjerne: tolkning av fritekst og analyse. Ingen data forlater enheten. */
(function (G) {
  'use strict';
  const CATS = [
    ['M', 'Melk/laktose', 'Melk', 'Melk, yoghurt, rømme, kesam, is, myke oster, brunost', 'FODMAP: laktose'],
    ['H', 'Hvete/rug/bygg', 'Hvete', 'Brød, pasta, knekkebrød, kaker, pizza, couscous', 'FODMAP: fruktaner'],
    ['L', 'Løk/hvitløk', 'Løk', 'Løk, hvitløk, purre – også i saus, taco, pizza, curry, pesto', 'FODMAP: fruktaner'],
    ['B', 'Bønner/linser', 'Bønner', 'Bønner, linser, kikerter, erter, hummus, falafel', 'FODMAP: GOS'],
    ['F', 'Fruktose-frukt', 'Fruktose', 'Eple, pære, mango, vannmelon, honning, juice, tørket frukt', 'FODMAP: fruktose'],
    ['P', 'Sukkerfritt/polyoler', 'Polyoler', 'Sukkerfri tyggegummi og pastiller, plommer, sopp, blomkål, avokado', 'FODMAP: polyoler'],
    ['K', 'Kaffe/koffein', 'Kaffe', 'Kaffe, espresso, latte, cola, energidrikk', 'Stimulerer tarmbevegelser'],
    ['A', 'Alkohol', 'Alkohol', 'Øl, vin, brennevin, cider', 'Kan irritere tarmen og gi løsere avføring'],
    ['T', 'Fet/fritert mat', 'Fet mat', 'Pommes frites, chips, burger, pølse, bacon, ribbe, fet saus', 'Forsterker tarmrefleksen etter måltid'],
    ['S', 'Sterk/krydret', 'Sterk', 'Chili, sterk curry, taco, kimchi, sriracha', 'Kan gi smerter og svie'],
    ['C', 'Kullsyre', 'Kullsyre', 'Brus, mineralvann, øl, musserende vin', 'Gir luft og oppblåsthet'],
  ];
  const FACT = [
    ['X', 'Stress', 'Stress', '«stress», «travel», «styremøte», «presset» …', 'Stress påvirker tarmen direkte'],
    ['N', 'Dårlig søvn', 'Dårlig søvn', '«sov dårlig», «lite søvn», «kort natt» …', 'Dårlig søvn kan forsterke plagene'],
    ['R', 'Trening', 'Trening', '«trening», «løpetur», «gåtur», «sykling» …', 'Fysisk aktivitet kan dempe plagene'],
  ];
  const TYPES = [
    { id: 'Hard', bri: 'Bristol 1–2', desc: 'Harde klumper eller klumpete pølse – tung å få ut', col: '#b5652b', bg: '#f3cba5' },
    { id: 'Normal', bri: 'Bristol 3–5', desc: 'Formet og myk – pølseformet, eller myke klumper med klare kanter', col: '#1e8a5a', bg: '#c8ebdd' },
    { id: 'Løs', bri: 'Bristol 6', desc: 'Grøtaktig, uten fast form', col: '#d94a00', bg: '#ffddb8' },
    { id: 'Flytende', bri: 'Bristol 7', desc: 'Vannaktig, ingen faste biter', col: '#c42222', bg: '#f7c4c4' },
  ];
  const STOP = new Set(('med og en et ei to tre fire fem seks i på av til fra litt mye noe noen glass kopp kopper skive skiver stk ' +
    'porsjon porsjoner stor store liten lite små halv halvt bit biter neve boks pose dl gram uten etter før hjemme jobb jobben ' +
    'kantina kantine lunsj middag frokost kvelds kveldsmat mellommåltid snacks rester god godt også samt eller som var ble har ' +
    'hadde inn ut opp den det de min mitt mine dobbel ekstra fersk ferske kokt kokte stekt stekte grillet ovnsbakt hjemmelaget ' +
    'rå restemat igjen går dag dagen kveld morgen natt vanlig vanlige drakk spiste fikk tok bare').split(' '));
  const DAY = 864e5;

  const parse = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const fromMs = ms => new Date(ms).toISOString().slice(0, 10);
  const addDays = (s, n) => fromMs(parse(s) + n * DAY);
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / DAY);
  const monday = s => { const wd = (new Date(parse(s)).getUTCDay() + 6) % 7; return addDays(s, -wd); };
  function isoWeek(s) {
    const d = new Date(parse(s)); const wd = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - wd + 3);
    const y = d.getUTCFullYear(); const j = new Date(Date.UTC(y, 0, 4));
    return 1 + Math.round(((d - j) / DAY - 3 + ((j.getUTCDay() + 6) % 7)) / 7);
  }
  function localToday() { const t = new Date(); return fromMs(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())); }

  function parseCodes(codes) {
    const c = {}; let neg = false;
    for (const ch of codes || '') { if (ch === '-') { neg = true; continue; } c[ch] = neg ? -1 : 1; }
    return c;
  }
  const norm = t => ' ' + String(t || '').toLowerCase().replace(/[,.\/+()\-:;!?\n\r\t]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  /* «uten X» og «uten X og Y»: ordene etter «uten» tas ut av teksten, og kategoriene deres oppheves. */
  function splitNeg(n) {
    const keep = [], neg = []; let skip = 0;
    for (const w of n.trim().split(' ')) {
      if (w === 'uten') { skip = 1; continue; }
      if (skip === 1) { neg.push(w); skip = 2; continue; }
      if (skip === 2) { if (w === 'og' || w === 'eller') { skip = 1; continue; } skip = 0; }
      keep.push(w);
    }
    return [' ' + keep.join(' ') + ' ', neg.length ? ' ' + neg.join(' ') + ' ' : ''];
  }
  const stripNeg = n => splitNeg(n)[0];
  function termOf(w) {
    const s = String(w.w || '').toLowerCase().trim().replace(/\s+/g, ' ');
    if (!s) return null;
    return w.m === 'H' ? ' ' + s + ' ' : w.m === 'O' ? ' ' + s : s;
  }
  function tag(text, words) {
    const [n, ng] = splitNeg(norm(text)); const sc = {}; const hits = []; const veto = new Set();
    for (const w of words) {
      const t = termOf(w); if (!t) continue;
      if (n.includes(t)) { hits.push(w.w); for (const k in w.c) sc[k] = (sc[k] || 0) + w.c[k]; }
      if (ng && ng.includes(t)) for (const k in w.c) if (w.c[k] > 0) veto.add(k);
    }
    return { known: hits.length > 0, cats: Object.keys(sc).filter(k => sc[k] > 0 && !veto.has(k)), hits, negated: !!ng };
  }
  function unknownWords(meals, words) {
    const phrases = words.map(w => ({ t: termOf(w), w })).filter(x => x.t && x.t.trim().includes(' '));
    const cnt = {};
    for (const m of meals) {
      const n = norm(m.text);
      const cover = new Set();
      for (const p of phrases) if (n.includes(p.t)) p.t.trim().split(' ').forEach(x => cover.add(x));
      for (const tok of n.trim().split(' ')) {
        if (tok.length < 3 || STOP.has(tok) || /\d/.test(tok) || cover.has(tok)) continue;
        if (!tag(tok, words).known) cnt[tok] = (cnt[tok] || 0) + 1;
      }
    }
    return Object.entries(cnt).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'nb'));
  }

  const mean = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
  const isNum = v => typeof v === 'number' && !isNaN(v);
  function hasDay(d) { return d && (isNum(d.pain) || isNum(d.bloat) || d.relief || (d.note && d.note.trim())); }

  function signal(t, minD) {
    if (Math.min(t.nWith, t.nWithout) < minD) return 'For lite data';
    const mm = [t.painDiff, t.bloatDiff].filter(isNum);
    const mx = mm.length ? Math.max(...mm) : 0;
    if (mx >= 2) return 'Tydelig signal';
    if (mx >= 1 || (isNum(t.looseDiff) && t.looseDiff >= 0.2)) return 'Mulig signal';
    return 'Ingen tydelig';
  }

  function analyze(S, today) {
    today = today || localToday();
    const st = Object.assign({ threshold: 3, minDays: 5, window: 2 }, S.settings || {});
    const words = S.words || [];
    const meals = (S.meals || []).map(m => Object.assign({}, m, { t: tag(m.text, words) }));
    const stools = S.stools || [];
    const days = S.days || {};
    const dayKeys = Object.keys(days).filter(k => hasDay(days[k]));
    const all = [...meals.map(m => m.date), ...stools.map(s => s.date), ...dayKeys].sort();
    const res = { empty: !all.length, settings: st, today };
    const nUnknown = meals.filter(m => !m.t.known).length;
    if (res.empty) return Object.assign(res, { key: { symptomDays: 0, meals: 0, unknownMeals: 0, visits: 0, redFlags: 0 }, unknown: [] });
    const d0 = all[0], d1 = all[all.length - 1];
    const mealsBy = {}, stoolsBy = {};
    meals.forEach(m => (mealsBy[m.date] = mealsBy[m.date] || []).push(m));
    stools.forEach(s => (stoolsBy[s.date] = stoolsBy[s.date] || []).push(s));
    const rows = [];
    for (let d = d0; d <= d1; d = addDays(d, 1)) {
      const ss = stoolsBy[d] || []; const dd = days[d] || {};
      const r = {
        date: d, visits: ss.length, hard: ss.filter(s => s.type === 'Hard').length,
        loose: ss.filter(s => s.type === 'Løs' || s.type === 'Flytende').length,
        liquid: ss.filter(s => s.type === 'Flytende').length, urgent: ss.filter(s => s.urgent).length,
        nMeals: (mealsBy[d] || []).length, pain: isNum(dd.pain) ? dd.pain : null, bloat: isNum(dd.bloat) ? dd.bloat : null,
        relief: dd.relief || null, exp: {}, fac: {},
      };

ACT.today = () => { day = Core.localToday(); render(); };
ACT.hideHint = () => { localStorage.setItem(HKEY, '1'); render(); };
ACT.saveMeal = () => {
  const el = $('#mealText'); const txt = el.value.trim();
  if (!txt) { el.focus(); return; }
  S.meals.push({ id: uid(), date: day, time: $('#mealTime').value || '', text: txt });
  draft.meal = ''; save(); render(); toast('Måltidet er lagret');
};
ACT.type = b => {
  draft.type = draft.type === b.dataset.v ? null : b.dataset.v;
  $$('.type').forEach(x => x.classList.toggle('on', x.dataset.v === draft.type));
  $('#saveStool').disabled = !draft.type;
};
ACT.tog = b => {
  const k = b.dataset.v; draft[k] = !draft[k]; b.classList.toggle('on', draft[k]);
  if (k === 'blood') $('#bloodWarn').classList.toggle('hidden', !draft.blood);
};
ACT.saveStool = () => {
  if (!draft.type) return;
  S.stools.push({ id: uid(), date: day, time: $('#stoolTime').value || '', type: draft.type, urgent: draft.urgent, blood: draft.blood, note: draft.note.trim() });
  const red = draft.blood;
  Object.assign(draft, { type: null, urgent: false, blood: false, note: '' });
  save(); render(); toast(red ? 'Lagret. Husk å kontakte fastlegen.' : 'Toalettbesøket er lagret');
};
ACT.scale = b => {
  const k = b.dataset.k, v = +b.dataset.v;
  setDay(k, (S.days[day] || {})[k] === v ? null : v);
  const cur = (S.days[day] || {})[k];
  b.parentElement.querySelectorAll('button').forEach(x => {
    const on = cur === +x.dataset.v; x.classList.toggle('on', on); x.style.background = on ? scaleCol(+x.dataset.v) : '';
  });
};
ACT.relief = b => {
  setDay('relief', (S.days[day] || {}).relief === b.dataset.v ? null : b.dataset.v);
  const cur = (S.days[day] || {}).relief;
  b.parentElement.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', cur === x.dataset.v));
};

/* ---------- Endre eller slette en registrering ---------- */
let ed = null;
function openEdit(k, id) {
  const o = (k === 'meal' ? S.meals : S.stools).find(x => x.id === id);
  if (!o) return;
  ed = { k, id, type: o.type, urgent: !!o.urgent, blood: !!o.blood };
  const when = `<div class="row"><label class="time">Dato <input type="date" id="eDate" value="${o.date}" style="width:150px"></label>` +
    `<label class="time">Kl. <input type="time" id="eTime" value="${esc(o.time || '')}"></label></div>`;
  const body = k === 'meal'
    ? `<h3>Endre måltid</h3><textarea id="eText" rows="3">${esc(o.text)}</textarea>${when}`
    : `<h3>Endre toalettbesøk</h3><div class="types">${Core.TYPES.map(t => `<button class="type${o.type === t.id ? ' on' : ''}" data-a="etype" data-v="${t.id}" style="--tb:${t.bg};--fg:${t.col}"><b>${t.id}</b><small>${t.bri}</small></button>`).join('')}</div>` +
      `<div class="chips"><button class="chip${o.urgent ? ' on' : ''}" data-a="etog" data-v="urgent">Hastverk</button><button class="chip red${o.blood ? ' on' : ''}" data-a="etog" data-v="blood">Blod eller slim</button></div>` +
      `<input type="text" id="eNote" value="${esc(o.note || '')}" placeholder="Kommentar" style="margin-top:10px">${when}`;
  sheet(body + `<div class="row" style="margin-top:16px"><button class="danger-btn" data-a="del">Slett</button><span class="grow"></span><button class="secondary" data-a="close">Avbryt</button><button class="primary" data-a="upd">Lagre</button></div>`);
}
ACT.edit = b => openEdit(b.dataset.k, b.dataset.id);
ACT.close = () => closeSheet();
ACT.etype = b => { ed.type = b.dataset.v; $$('#sheet .type').forEach(x => x.classList.toggle('on', x.dataset.v === ed.type)); };
ACT.etog = b => { const k = b.dataset.v; ed[k] = !ed[k]; b.classList.toggle('on', ed[k]); };
ACT.upd = () => {
  const list = ed.k === 'meal' ? S.meals : S.stools; const o = list.find(x => x.id === ed.id); if (!o) return;
  const date = $('#eDate').value || o.date, time = $('#eTime').value || '';
  if (ed.k === 'meal') { const txt = $('#eText').value.trim(); if (!txt) return; Object.assign(o, { text: txt, date, time }); }
  else Object.assign(o, { type: ed.type, urgent: ed.urgent, blood: ed.blood, note: $('#eNote').value.trim(), date, time });
  save(); closeSheet(); render(); toast('Endringen er lagret');
};
ACT.del = () => {
  if (!confirm('Slette denne registreringen?')) return;
  if (ed.k === 'meal') S.meals = S.meals.filter(x => x.id !== ed.id); else S.stools = S.stools.filter(x => x.id !== ed.id);
  save(); closeSheet(); render(); toast('Slettet');
};

document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const f = ACT[b.dataset.a]; if (f) { e.preventDefault(); f(b, e); }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'mealText') { draft.meal = e.target.value; mealPreview(); }
  else if (id === 'stoolNote') draft.note = e.target.value;
  else if (id === 'dayNote') { setDay('note', e.target.value, false); notePreview(); }
  else if (id === 'wordSearch') filterWords(e.target.value);
});

/* Magedagbok – brukergrensesnitt, del 2: historikk, analyse, mer, ordliste, rapport og sikkerhetskopi */

/* ---------- Historikk ---------- */
VIEWS.historikk = () => {
  const set = new Set([...S.meals.map(m => m.date), ...S.stools.map(s => s.date), ...Object.keys(S.days).filter(k => Core.hasDay(S.days[k]))]);
  const ds = [...set].sort().reverse();
  if (!ds.length) return '<section class="card"><h2>Ingen data ennå</h2><p class="mut">Registreringene dine vises her, dag for dag.</p></section>';
  return ds.map(d => {
    const dd = S.days[d] || {};
    const st = S.stools.filter(s => s.date === d).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    const ml = S.meals.filter(m => m.date === d);
    const unk = ml.filter(m => !Core.tag(m.text, S.words).known).length;
    const sym = [isNum(dd.pain) ? `Smerte ${dd.pain}` : '', isNum(dd.bloat) ? `Oppblåst ${dd.bloat}` : ''].filter(Boolean).join(' · ') || '<span class="mut">Ingen symptomscore</span>';
    const dots = st.map(s => `<i class="dot" style="background:${typeOf(s.type).col}"></i>`).join('');
    return `<button class="hrow" data-a="goto" data-v="${d}"><div class="hdate">${DSH[dObj(d).getDay()]}<small>${shortDate(d)}</small></div>` +
      `<div class="hinfo">${sym}<div class="m">${dots} ${st.length} besøk · ${ml.length} måltider${unk ? ` · ${unk} ukjente` : ''}` +
      `${st.some(s => s.blood) ? ' · <b style="color:var(--red)">blod/slim</b>' : ''}</div></div></button>`;
  }).join('');
};
ACT.goto = b => { day = b.dataset.v; location.hash = '#logg'; };

/* ---------- Analyse ---------- */
const SIGCLS = { 'Tydelig signal': 'p-tydelig', 'Mulig signal': 'p-mulig', 'Ingen tydelig': 'p-ingen', 'For lite data': 'p-lite' };
const SIGORD = { 'Tydelig signal': 0, 'Mulig signal': 1, 'Ingen tydelig': 2, 'For lite data': 3 };
const kpi = (v, l) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
const yes = ok => (ok === null ? '<span class="status s-nei">–</span>' : ok ? '<span class="status s-ja">Ja</span>' : '<span class="status s-nei">Nei</span>');
function trigHTML(t, i) {
  return `<div class="trig${i === 0 ? ' first' : ''}"><div class="trh"><b>${esc(t.name)}${t.kind === 'faktor' ? ' <span class="mut" style="font-weight:400">(notat)</span>' : ''}</b>` +
    `<span class="pill ${SIGCLS[t.signal]}">${t.signal}</span></div>` +
    `<div class="trd">Smerte <b>${sg1(t.painDiff)}</b> · Oppblåst <b>${sg1(t.bloatDiff)}</b> · Løs avf. <b>${sgp(t.looseDiff)}</b></div>` +
    `<div class="trn">${t.nWith} dager med, ${t.nWithout} dager uten</div></div>`;
}
function weekChart(W) {
  if (!W.length) return '';
  const w = 320, h = 150, L = 24, B = 20, T = 8, R = 8, n = W.length;
  const x = i => (n === 1 ? L + (w - L - R) / 2 : L + (i * (w - L - R)) / (n - 1));
  const y = v => T + (h - T - B) * (1 - Math.min(v, 10) / 10);
  const series = [['avgPain', '#dc2a2a', 'Magesmerter'], ['avgBloat', '#e09a00', 'Oppblåsthet'], ['visitsPerDay', '#007272', 'Toalettbesøk per dag']];
  let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Utvikling per uke">`;
  for (const g of [0, 5, 10]) s += `<line x1="${L}" x2="${w - R}" y1="${y(g)}" y2="${y(g)}" stroke="#dde6e4"/><text x="${L - 6}" y="${y(g) + 4}" font-size="10" text-anchor="end" fill="#5e7275">${g}</text>`;
  const step = Math.ceil(n / 8);
  W.forEach((wk, i) => { if (i % step === 0 || i === n - 1) s += `<text x="${x(i)}" y="${h - 5}" font-size="10" text-anchor="middle" fill="#5e7275">u${wk.week}</text>`; });
  for (const [k, col] of series) {
    const segs = []; let seg = [];
    W.forEach((wk, i) => { const v = wk[k]; if (v === null || v === undefined) { if (seg.length) segs.push(seg); seg = []; } else seg.push([x(i), y(v)]); });
    if (seg.length) segs.push(seg);
    for (const sg of segs) {
      if (sg.length > 1) s += `<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${sg.map(p => p.map(q => q.toFixed(1)).join(',')).join(' ')}"/>`;
      sg.forEach(p => (s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${col}"/>`));
    }
  }
  return s + '</svg>' + `<div class="chips" style="margin:2px 0 8px">${series.map(([, c, l]) => `<span class="tag" style="background:#fff;color:${c}">● ${l}</span>`).join('')}</div>`;
}
VIEWS.analyse = () => {
  const R = Core.analyze(S);
  if (R.empty) return '<section class="card"><h2>Ingen data ennå</h2><p class="mut">Analysen fylles ut når du har logget noen dager. Vil du se hvordan den ser ut? Gå til <b>Mer → Vis eksempel</b>.</p></section>';
  const k = R.key, r = R.rome, D = R.dist;
  let h = '';
  if (k.redFlags) h += `<div class="warn" style="margin:0 0 12px">Du har registrert blod eller slim ${k.redFlags} ${k.redFlags === 1 ? 'gang' : 'ganger'}. Kontakt fastlegen.</div>`;
  if (k.symptomDays < 14) h += `<div class="note">Du har ${k.symptomDays} ${k.symptomDays === 1 ? 'dag' : 'dager'} med symptomscore. Vent med å tolke utløserne til du har logget i 2–4 uker.</div>`;
  h += `<section class="card"><h2>Nøkkeltall</h2><div class="kpis">${kpi(k.symptomDays, 'dager med symptomscore')}${kpi(n1(k.visitsPerDay), 'toalettbesøk per dag')}` +
    `${kpi(n1(k.avgPain), 'magesmerter i snitt (0–10)')}${kpi(n1(k.avgBloat), 'oppblåsthet i snitt (0–10)')}${kpi(n1(k.painDaysPerWeek), 'smertedager per uke')}${kpi(k.meals, 'måltider registrert')}</div>` +
    `${k.unknownMeals ? `<div class="preview">${k.unknownMeals} måltider har ingen kjente ord. Se «Ukjente ord» nederst.</div>` : ''}</section>`;
  const mx = Math.max(1, ...Core.TYPES.map(t => D.counts[t.id]));
  h += `<section class="card"><h2>Avføringstyper</h2>${Core.TYPES.map(t => `<div class="bar"><span class="bl">${t.id}</span><span class="bt"><i style="width:${(D.counts[t.id] / mx) * 100}%;background:${t.col}"></i></span>` +
    `<span class="bv">${D.counts[t.id]} · ${pct(D.sum ? D.counts[t.id] / D.sum : null)}</span></div>`).join('')}<div class="preview">${D.sum} besøk. Løs eller flytende: ${pct(D.looseShare)}.</div></section>`;
  const b = v => (isNum(v) ? v : null);
  h += `<section class="card"><h2>IBS-mønster (Rom IV)</h2><table class="t">` +
    `<tr><td>Smertedager per uke, minst 1</td><td>${n1(r.painDaysPerWeek)}</td><td>${yes(b(r.painDaysPerWeek) === null ? null : r.painDaysPerWeek >= 1)}</td></tr>` +
    `<tr><td>Smerten blir bedre etter toalettbesøk</td><td>${pct(r.relief)}</td><td>${yes(b(r.relief) === null ? null : r.relief >= 0.5)}</td></tr>` +
    `<tr><td>Harde, over 25 %</td><td>${pct(r.hardShare)}</td><td>${yes(b(r.hardShare) === null ? null : r.hardShare > 0.25)}</td></tr>` +
    `<tr><td>Løse eller flytende, over 25 %</td><td>${pct(r.looseShare)}</td><td>${yes(b(r.looseShare) === null ? null : r.looseShare > 0.25)}</td></tr></table>` +
    `<p><b>${esc(r.pattern)}</b></p><p class="preview">Rom IV: magesmerter minst 1 dag per uke de siste 3 månedene, knyttet til toalettbesøk eller endret avføring. ` +
    `Legen stiller diagnosen etter at andre årsaker er utelukket. Dette er ikke en diagnose.</p></section>`;
  const tr = R.triggers.slice().sort((a, c) => SIGORD[a.signal] - SIGORD[c.signal] || (isNum(c.painDiff) ? c.painDiff : -9) - (isNum(a.painDiff) ? a.painDiff : -9));
  const win = R.settings.window;
  h += `<section class="card"><h2>Mulige utløsere</h2><p class="preview" style="margin-top:0">Mat: dager du har spist kategorien ${win > 1 ? `(samme dag eller inntil ${win - 1} ${win - 1 === 1 ? 'døgn' : 'døgn'} før)` : '(samme dag)'} mot dager uten. ` +
    `Stress, søvn og trening: fra notatet samme dag. Positive tall betyr mer plager. Sammenheng er ikke bevis. Test ved å kutte ut i 2–4 uker.</p>${tr.map(trigHTML).join('')}</section>`;
  h += `<section class="card"><h2>Uke for uke</h2>${weekChart(R.weeks)}<div class="scroll"><table class="t"><tr><th>Uke</th><th>Smerte</th><th>Oppbl.</th><th>Besøk/d</th><th>Løs</th><th>Hard</th></tr>` +
    R.weeks.slice().reverse().map(w => `<tr><td>${w.week} <span class="mut">(${shortDate(w.start)})</span></td><td>${n1(w.avgPain)}</td><td>${n1(w.avgBloat)}</td><td>${n1(w.visitsPerDay)}</td><td>${pct(w.looseShare)}</td><td>${pct(w.hardShare)}</td></tr>`).join('') +
    '</table></div></section>';
  h += `<section class="card"><h2>Ukjente ord</h2>${R.unknown.length
    ? `<p class="preview" style="margin-top:0">Ord fra måltidene som ordlisten ikke kjenner. Trykk på et ord for å legge det til.</p><div class="chips">${R.unknown.slice(0, 40).map(([w, n]) => `<button class="chip" data-a="addWord" data-v="${esc(w)}">${esc(w)} <span class="mut">${n}</span></button>`).join('')}</div>`
    : '<p class="mut">Ordlisten kjenner alle ordene du har brukt.</p>'}</section>`;
  return h;
};

/* ---------- Mer ---------- */
VIEWS.mer = () => `<section class="card"><h2>Sikkerhetskopi</h2><p class="preview" style="margin-top:0">Dataene ligger bare på denne telefonen. Lagre en kopi i Filer-appen jevnlig, for eksempel i iCloud Drive. ` +
  `Siste kopi: <b>${S.lastBackup ? fullDate(S.lastBackup.slice(0, 10)) : 'aldri'}</b>.</p><div class="menu">` +
  '<button data-a="backup">Lag sikkerhetskopi<span class="sub">JSON-fil</span></button><button data-a="restore">Gjenopprett fra kopi<span class="sub">erstatter dataene</span></button>' +
  '<button data-a="csv">Eksporter til Excel<span class="sub">3 CSV-filer</span></button></div><input type="file" id="restoreFile" accept=".json,application/json" class="hidden"></section>' +
  '<section class="card"><h2>Til legen</h2><div class="menu"><a href="#rapport">Rapport til legetimen<span class="sub">›</span></a><a href="#info">Avføringstyper og røde flagg<span class="sub">›</span></a></div></section>' +
  `<section class="card"><h2>Tilpasning</h2><div class="menu"><a href="#ord">Ordliste<span class="sub">${S.words.length} ord ›</span></a><a href="#innst">Innstillinger for analysen<span class="sub">›</span></a></div></section>` +
  `<section class="card"><h2>Annet</h2><div class="menu">${demo ? '<button data-a="endDemo">Avslutt eksempel</button>' : '<button data-a="startDemo">Vis eksempel med fiktive data<span class="sub">endrer ikke dine data</span></button>'}` +
  `<button data-a="wipe" style="color:var(--red)">Slett alle data på telefonen</button></div><p class="preview">Magedagbok ${VERSION}. Appen sender ingen data noe sted. Den stiller ingen diagnose.</p></section>`;

const stepper = (k, l, d, min, max) => `<div class="step"><div><b>${l}</b><div class="preview">${d}</div></div><div class="stp">` +
  `<button data-a="stp" data-k="${k}" data-v="-1" data-min="${min}" data-max="${max}" aria-label="Mindre">−</button><span id="st-${k}">${S.settings[k]}</span>` +
  `<button data-a="stp" data-k="${k}" data-v="1" data-min="${min}" data-max="${max}" aria-label="Mer">+</button></div></div>`;
VIEWS.innst = () => '<section class="card"><h2>Innstillinger for analysen</h2>' +
  stepper('threshold', 'Smerteterskel for «smertedag»', 'Magesmerter på dette nivået eller høyere teller som smertedag.', 0, 10) +
  stepper('minDays', 'Minste antall dager per gruppe', 'Utløserne viser «For lite data» til begge gruppene har så mange dager.', 2, 60) +
  stepper('window', 'Tidsvindu for mat (døgn)', '2 = samme dag og dagen før (anbefalt). 1 = bare samme dag.', 1, 3) +
  '</section><a class="link" href="#mer">‹ Tilbake</a>';
ACT.stp = b => {
  const k = b.dataset.k; const v = Math.min(+b.dataset.max, Math.max(+b.dataset.min, S.settings[k] + +b.dataset.v));
  S.settings[k] = v; save(); $('#st-' + k).textContent = v;
};

/* ---------- Ordliste ---------- */
function wordRow(w, i) {
  const tags = Object.entries(w.c).map(([k, v]) => `<span class="tag${v < 0 ? ' unk' : ''}">${v < 0 ? 'unntak: ' : ''}${esc(catLabel(k))}</span>`).join('') || '<span class="tag grey">kjent ord</span>';
  return `<button class="wordrow" data-a="editWord" data-i="${i}" data-w="${esc(w.w.toLowerCase())}"><span><b>${esc(w.w)}</b> <span class="mut" style="font-size:13px">${MODE[w.m]}</span></span><span class="tags">${tags}</span></button>`;
}
VIEWS.ord = () => {
  const list = S.words.map((w, i) => [w, i]).sort((a, b) => a[0].w.localeCompare(b[0].w, 'nb'));
  return `<section class="card"><h2>Ordliste</h2><p class="preview" style="margin-top:0">Appen leter etter disse ordene i det du skriver. Trykk på et ord for å endre det.</p>` +
    `<input type="search" id="wordSearch" placeholder="Søk i ${S.words.length} ord"><div class="row"><button class="primary" data-a="addWord" data-v="">Nytt ord</button><span class="grow"></span>` +
    `<button class="link" data-a="resetWords">Tilbakestill</button></div><div id="wordList" style="margin-top:6px">${list.map(([w, i]) => wordRow(w, i)).join('')}</div></section><a class="link" href="#mer">‹ Tilbake</a>`;
};
function filterWords(q) { q = q.trim().toLowerCase(); $$('#wordList .wordrow').forEach(r => r.classList.toggle('hidden', !!q && !r.dataset.w.includes(q))); }
let we = null;
function catBtn(k, l) { const v = we.c[k]; return `<button class="cat${v > 0 ? ' x' : v < 0 ? ' neg' : ''}" data-a="wcat" data-v="${k}"><span>${esc(l)}</span><span>${v > 0 ? '✓' : v < 0 ? 'unntak' : ''}</span></button>`; }
function openWord(i, preset) {
  const w = i >= 0 ? S.words[i] : { w: preset || '', m: 'D', c: {} };
  we = { i, m: w.m, c: Object.assign({}, w.c) };
  sheet(`<h3>${i >= 0 ? 'Endre ord' : 'Nytt ord'}</h3><input type="text" id="wWord" value="${esc(w.w)}" placeholder="Ord eller uttrykk" autocapitalize="off" autocorrect="off">` +
    `<div class="lbl" style="margin-top:12px">Treff</div><div class="seg">${['D', 'O', 'H'].map(m => `<button data-a="wmode" data-v="${m}" class="${we.m === m ? 'on' : ''}">${MODE[m]}</button>`).join('')}</div>` +
    '<div class="preview">«Del av ord»: «melk» finner også «lettmelk». «Ordstart»: «øl» finner «ølen», men ikke «pølse». «Helt ord»: «is» finner bare «is».</div>' +
    '<div class="lbl" style="margin-top:12px">Kategorier <span>trykk én gang = hører til, to ganger = unntak</span></div>' +
    `<div class="catgrid">${ALLC.map(([k, , l]) => catBtn(k, l)).join('')}</div><p class="preview">Uten kategori blir ordet et kjent ord uten utløser, for eksempel «kylling».</p>` +
    `<div class="row" style="margin-top:14px">${i >= 0 ? '<button class="danger-btn" data-a="wdel">Slett</button>' : ''}<span class="grow"></span><button class="secondary" data-a="close">Avbryt</button><button class="primary" data-a="wsave">Lagre</button></div>`);
}
ACT.addWord = b => openWord(-1, b.dataset.v);
ACT.editWord = b => openWord(+b.dataset.i);
ACT.wmode = b => { we.m = b.dataset.v; $$('#sheet .seg button').forEach(x => x.classList.toggle('on', x.dataset.v === we.m)); };
ACT.wcat = b => {
  const k = b.dataset.v; const v = we.c[k];
  if (!v) we.c[k] = 1; else if (v > 0) we.c[k] = -1; else delete we.c[k];
  b.outerHTML = catBtn(k, catLabel(k));
};
ACT.wsave = () => {
  const w = $('#wWord').value.trim();
  if (!w) { $('#wWord').focus(); return; }
  const o = { w, m: we.m, c: we.c };
  if (we.i >= 0) S.words[we.i] = o; else S.words.push(o);
  save(); closeSheet(); render(); toast('Ordlisten er oppdatert');
};
ACT.wdel = () => { if (!confirm('Slette ordet fra ordlisten?')) return; S.words.splice(we.i, 1); save(); closeSheet(); render(); };
ACT.resetWords = () => { if (!confirm('Tilbakestille ordlisten til standard? Ord du har lagt til, forsvinner.')) return; S.words = mkWords(); save(); render(); toast('Ordlisten er tilbakestilt'); };

/* ---------- Rapport til legen ---------- */
VIEWS.rapport = () => {
  const R = Core.analyze(S);
  const top = '<div class="noprint row" style="margin:0 0 12px"><a class="link" href="#mer">‹ Tilbake</a><span class="grow"></span><button class="primary" data-a="print">Skriv ut / lagre PDF</button></div>';
  if (R.empty) return top + '<section class="card">Ingen data ennå.</section>';
  const k = R.key, D = R.dist, r = R.rome;
  return top + `<section class="card"><h2>Mage- og matdagbok – oppsummering</h2><p>Periode: <b>${fullDate(k.from)}–${fullDate(k.to)}</b>. ${k.symptomDays} dager med symptomscore, ${k.visits} toalettbesøk og ${k.meals} måltider.</p>` +
    `<table class="t"><tr><td>Toalettbesøk per dag</td><td>${n1(k.visitsPerDay)}</td></tr><tr><td>Magesmerter i snitt (0–10)</td><td>${n1(k.avgPain)}</td></tr>` +
    `<tr><td>Oppblåsthet i snitt (0–10)</td><td>${n1(k.avgBloat)}</td></tr><tr><td>Smertedager per uke (smerte ≥ ${R.settings.threshold})</td><td>${n1(k.painDaysPerWeek)}</td></tr>` +
    `<tr><td>Smerten bedre etter toalettbesøk</td><td>${pct(r.relief)}</td></tr><tr><td>Besøk med blod eller slim</td><td>${k.redFlags}</td></tr></table></section>` +
    `<section class="card"><h2>Avføringstyper</h2><table class="t"><tr><th>Type</th><th>Bristol</th><th>Antall</th><th>Andel</th></tr>` +
    Core.TYPES.map(t => `<tr><td>${t.id}</td><td>${t.bri.replace('Bristol ', '')}</td><td>${D.counts[t.id]}</td><td>${pct(D.sum ? D.counts[t.id] / D.sum : null)}</td></tr>`).join('') +
    `</table><p><b>Mønster:</b> ${esc(r.pattern)}</p></section>` +
    `<section class="card"><h2>Mulige utløsere</h2><div class="scroll"><table class="t"><tr><th>Kategori</th><th>Dager med/uten</th><th>Smerte</th><th>Oppbl.</th><th>Løs</th><th>Signal</th></tr>` +
    R.triggers.slice().sort((a, c) => SIGORD[a.signal] - SIGORD[c.signal]).map(t => `<tr><td>${esc(t.name)}</td><td>${t.nWith}/${t.nWithout}</td><td>${sg1(t.painDiff)}</td><td>${sg1(t.bloatDiff)}</td><td>${sgp(t.looseDiff)}</td><td>${t.signal}</td></tr>`).join('') +

    R.weeks.map(w => `<tr><td>${w.week} (${shortDate(w.start)})</td><td>${n1(w.avgPain)}</td><td>${n1(w.avgBloat)}</td><td>${n1(w.visitsPerDay)}</td><td>${pct(w.looseShare)}</td><td>${pct(w.hardShare)}</td><td>${w.painDays === null ? '–' : w.painDays}</td></tr>`).join('') +
    '</table></div></section><p class="preview">Registrert av pasienten selv i appen Magedagbok. Avføringstyper: Hard = Bristol 1–2, Normal = 3–5, Løs = 6, Flytende = 7. Dette er ikke en diagnose.</p>';
};
ACT.print = () => window.print();

/* ---------- Sikkerhetskopi og eksport ---------- */
async function shareOrDownload(files, title) {
  try {
    if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files, title }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  for (const f of files) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
  return true;
}
ACT.backup = async () => {
  if (demo) { toast('Ikke tilgjengelig i eksempelet'); return; }
  const f = new File([JSON.stringify({ app: 'magedagbok', version: 1, exported: new Date().toISOString(), data: S })], `magedagbok-${Core.localToday()}.json`, { type: 'application/json' });
  if (await shareOrDownload([f], 'Magedagbok – sikkerhetskopi')) { S.lastBackup = new Date().toISOString(); save(); render(); toast('Sikkerhetskopien er laget'); }
};
ACT.restore = () => $('#restoreFile').click();
document.addEventListener('change', async e => {
  if (e.target.id !== 'restoreFile') return;
  const file = e.target.files[0]; if (!file) return;
  try {
    const j = JSON.parse(await file.text()); const d = j.data || j;
    if (j.app !== 'magedagbok' || !Array.isArray(d.meals) || !Array.isArray(d.stools)) throw new Error('Filen er ikke en sikkerhetskopi fra Magedagbok.');
    if (!confirm(`Kopien har ${d.meals.length} måltider og ${d.stools.length} toalettbesøk. Den erstatter dataene på telefonen. Fortsette?`)) return;
    if (demo) ACT.endDemo();
    S = Object.assign(fresh(), d); save(); render(); toast('Dataene er gjenopprettet');
  } catch (err) { alert('Kunne ikke lese filen: ' + err.message); } finally { e.target.value = ''; }
});
ACT.csv = async () => {
  const q = v => { v = v === null || v === undefined ? '' : String(v); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = rows => '\ufeff' + rows.map(r => r.map(q).join(';')).join('\r\n');
  const cmp = (a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''));
  const m = [['Dato', 'Kl.', 'Hva spiste eller drakk du?', 'Tolket som']].concat(S.meals.slice().sort(cmp).map(x => {
    const t = Core.tag(x.text, S.words);
    return [x.date, x.time, x.text, t.known ? t.cats.map(catLabel).join(', ') || 'Ingen kjente utløsere' : 'Ukjent'];
  }));
  const t = [['Dato', 'Kl.', 'Avføring', 'Bristol', 'Hastverk', 'Blod eller slim', 'Kommentar']].concat(S.stools.slice().sort(cmp).map(x => [x.date, x.time, x.type, typeOf(x.type).bri.replace('Bristol ', ''), x.urgent ? 'Ja' : '', x.blood ? 'Ja' : '', x.note]));
  const d = [['Dato', 'Magesmerter', 'Oppblåsthet', 'Bedre etter toalettbesøk', 'Notat']].concat(Object.keys(S.days).sort().filter(k => Core.hasDay(S.days[k])).map(k => { const x = S.days[k]; return [k, x.pain, x.bloat, x.relief, x.note]; }));
  const st = Core.localToday();
  await shareOrDownload([new File([csv(m)], `maltider-${st}.csv`, { type: 'text/csv' }), new File([csv(t)], `toalett-${st}.csv`, { type: 'text/csv' }), new File([csv(d)], `dagslogg-${st}.csv`, { type: 'text/csv' })], 'Magedagbok – eksport');
};
ACT.startDemo = () => { sessionStorage.setItem(DKEY, '1'); demo = true; S = demoState(); location.hash = '#analyse'; render(); };
ACT.endDemo = () => { sessionStorage.removeItem(DKEY); demo = false; S = load(); day = Core.localToday(); render(); };
ACT.wipe = () => {
  if (demo) { toast('Avslutt eksempelet først'); return; }
  if (!confirm('Slette ALLE data på telefonen? Dette kan ikke angres.')) return;
  if (!confirm('Er du sikker? Har du tatt en sikkerhetskopi?')) return;
  localStorage.removeItem(KEY); S = fresh(); day = Core.localToday(); location.hash = '#logg'; render(); toast('Alle data er slettet');
};

/* ---------- Start ---------- */
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

})();
